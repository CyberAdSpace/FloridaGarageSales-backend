app = "florida-garage-sales-api"
primary_region = "iad"

[build]

[env]
  FRONTEND_URL = "https://www.floridagaragesales.com"
  DATABASE_URL = "sqlite:////data/store.db"
  UPLOAD_DIR = "/data/uploads"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[mounts]
  source = "fgs_data"
  destination = "/data"
